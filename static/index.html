<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Claude Service</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- 左侧 SSH 管理面板 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-resizer" id="sidebarResizer"></div>
        <h2>SSH 连接管理</h2>

        <!-- 添加连接表单 -->
        <div>
            <h3 class="collapsible" onclick="toggleCollapse(this)">添加新服务器</h3>
            <div class="collapse-content" id="addServerForm">
                <form id="connectForm" style="margin-top: 10px;">
                    <div class="form-group">
                        <label>连接别名</label>
                        <input type="text" id="hostId" placeholder="如: my-server" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>主机地址</label>
                            <input type="text" id="host" placeholder="IP 或域名" required>
                        </div>
                        <div class="form-group" style="flex: 0 0 80px;">
                            <label>端口</label>
                            <input type="number" id="port" value="22" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="username" placeholder="root" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full-width">添加并连接</button>
                </form>
            </div>
        </div>

        <!-- 服务器列表 -->
        <div class="servers-section">
            <h3>已保存的服务器</h3>
            <div class="servers-list" id="serversList">
                <div style="color: #888; font-size: 13px;">暂无保存的服务器</div>
            </div>
        </div>

        <!-- 手动执行命令 -->
        <div class="manual-exec">
            <h3>手动执行命令</h3>
            <div id="execHistory" class="exec-history">
                <div class="exec-history-empty">执行结果将显示在这里</div>
            </div>
            <div class="exec-input-row">
                <textarea id="execCommand" placeholder="ls" rows="1"></textarea>
                <button class="btn btn-primary btn-exec" onclick="manualExec()">执行</button>
            </div>
        </div>

        <!-- Claude 配置 -->
        <div class="config-section">
            <h3 class="collapsible collapsed" id="configHeader" onclick="toggleConfigPanel()">Claude 配置</h3>
            <div class="config-panel collapsed" id="configPanel">
                <div class="config-form" style="margin-top: 10px;">
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="password" id="configApiKey" placeholder="sk-ant-...">
                    </div>
                    <div class="form-group">
                        <label>Base URL (可选)</label>
                        <input type="text" id="configBaseUrl" placeholder="https://api.anthropic.com">
                    </div>
                </div>
                <div class="config-actions">
                    <button class="btn btn-primary btn-sm" onclick="saveConfig()">保存</button>
                    <button class="btn btn-danger btn-sm" id="configClearBtn" onclick="clearConfig()">清除</button>
                </div>
                <div class="config-sources">
                    <div class="config-sources-title">配置来源（优先级从高到低）</div>
                    <div id="configSources">
                        <!-- 由 JS 动态渲染 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧 Claude 对话面板 -->
    <div class="main">
        <div class="header">
            <h1>Remote Claude Service</h1>
            <p>使用 Claude 智能管理你的远程服务器</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <p>先在左侧添加 SSH 服务器，然后在下方输入框与 Claude 对话</p>
                <p>例如: "帮我看看 my-server 的系统负载"</p>
            </div>
        </div>

        <div class="chat-input-container">
            <textarea id="chatInput" placeholder="输入消息，让 Claude 帮你操作服务器... (Enter 发送，Shift+Enter 换行)"
                      rows="1"></textarea>
            <button class="btn btn-danger btn-stop" id="stopButton" onclick="stopStreaming()" disabled>停止</button>
            <button class="btn btn-primary btn-send" onclick="sendMessage()">发送</button>
        </div>
    </div>

    <!-- JS 模块（按依赖顺序加载） -->
    <script src="/static/js/lib/marked.min.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/ssh.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
